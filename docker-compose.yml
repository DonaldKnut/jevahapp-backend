version: "3.8"

services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGODB_URI=mongodb://mongo:27017/jevah
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-development-jwt-secret
      - RESEND_API_KEY=your-resend-api-key
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=debug
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_ENGAGEMENT_TOPIC=jevah.engagement.events
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
    depends_on:
      - mongo
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - jevah-network

  # BullMQ worker (media-processing + analytics). Required for queue jobs to run.
  worker:
    build: .
    command: ["npm", "run", "worker:dev"]
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/jevah
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_ENGAGEMENT_TOPIC=jevah.engagement.events
      - LOG_LEVEL=debug
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
    depends_on:
      - mongo
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - jevah-network

  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    restart: unless-stopped
    networks:
      - jevah-network

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=jevah
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    networks:
      - jevah-network

  # Local Redis for engagement hot path + integration tests
  # (In production Contabo, bind Redis to 127.0.0.1 on the host — see docs/REDIS_OPS.md)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--protected-mode", "yes"]
    restart: unless-stopped
    networks:
      - jevah-network

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ADMINUSERNAME=
      - ME_CONFIG_MONGODB_ADMINPASSWORD=
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - jevah-network

volumes:
  mongo_data:

networks:
  jevah-network:
    driver: bridge
